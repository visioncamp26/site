<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VISION '26 — Песни</title>

  <style>
    :root {
      --primary: #0B3D2E;
      --secondary: #F4F1E8;
      --white: #FFFFFF;
      --text: #111111;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: var(--white);
      color: var(--text);
    }

    nav {
      text-align: center;
      margin-bottom: 20px;
      font-weight: bold;
    }

    nav a {
      color: var(--primary);
      text-decoration: none;
      margin: 0 10px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    #container {
      max-width: 650px;
      margin: auto;
      background: var(--primary);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
    }

    h1 {
      color: var(--white);
      text-align: center;
      margin-top: 0;
    }

    .group {
      margin-bottom: 20px;
    }

    .group-title {
      color: var(--primary);
      background: var(--secondary);
      padding: 12px;
      border-radius: 7px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .song {
      display: block;
      background: var(--white);
      color: var(--primary);
      text-decoration: none;
      padding: 14px;
      margin-bottom: 7px;
      border-radius: 7px;
      font-weight: bold;
      transition: 0.15s;
    }

    .song:hover {
      background: var(--secondary);
      transform: translateY(-1px);
    }
  </style>
</head>
