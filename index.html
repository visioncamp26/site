    :root {
      --primary: #0B3D2E;
      --secondary: #D6CEC4;
      --white: #FFFFFF;
      --text: #111111;
      --border: #D9D9D9;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: var(--white);
      margin: 0;
      color: var(--text);
    }

    #container {
      background-color: var(--primary);
      padding: 20px;
      border-radius: 8px;
      max-width: 650px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
      color: var(--white);
    }

    h1 {
      text-align: center;
      color: var(--white);
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background-color: var(--white);
      color: var(--text);
      font-size: 16px;
    }

    button {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      background-color: var(--secondary);
      color: var(--primary);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }

    button:hover {
      background-color: #E8E3D8;
    }

    #result {
      margin-top: 20px;
    }

    .songs {
      background-color: var(--secondary);
      color: var(--primary);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-weight: bold;
      word-wrap: break-word;
    }

    .songs a {
      color: var(--primary);
      text-decoration: underline;
    }

    .camper-container {
      background-color: var(--white);
      padding: 15px;
      border-radius: 8px;
      color: var(--primary);
      margin-bottom: 15px;
      font-size: 0.95em;
    }

    nav {
      text-align: center;
      margin-bottom: 15px;
      font-weight: bold;
    }

    nav a {
      color: var(--primary);
      text-decoration: none;
      margin: 0 10px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .not-found {
      color: var(--primary);
      background-color: var(--secondary);
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>

    // ============================================================

    function search() {

      const query = document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

      const resultDiv =
        document.getElementById("result");

      resultDiv.innerHTML = "";


      if (!query) {
        return;
      }


      // ==========================================================
      // ВЪПРОСИ
      // ==========================================================

      if (query === "въпроси") {

        if (questions.length === 0) {
          resultDiv.innerHTML = `
            <div class="songs">
              Въпросите все още не са добавени.
            </div>
          `;

          return;
        }


        resultDiv.innerHTML = `
          <div class="songs">

            ${questions.map((question, index) =>
              `${index + 1}. ${question}<br>`
            ).join("")}

          </div>
        `;

        return;
      }


      // ==========================================================
      // CAMPERS
      // ==========================================================

      const campers = people.filter(person =>
        person.име
          .toLowerCase()
          .includes(query)
      );


      if (campers.length > 0) {

        campers.forEach(camper => {

          const songs =
            groupSongs[camper.дискусионнаГрупа] || [];


          let songsHTML = "";


          if (songs.length > 0) {

            songsHTML = `

              <div class="songs">

                🎵 Песни:<br>

                ${songs.map(song => {

                  if (song.url) {

                    return `
                      • <a
                          href="${song.url}"
                          target="_blank"
                          rel="noopener noreferrer"
                        >
                          ${song.title}
                        </a>
                        <br>
                    `;

                  }

                  return `
                    • ${song.title}<br>
                  `;

                }).join("")}

              </div>

            `;
          }


          resultDiv.innerHTML += `

            <div class="camper-container">

              ${songsHTML}

              <strong>Име:</strong>
              ${camper.име}
              <br>

              <strong>Ателие:</strong>
              ${camper.ателие}
              <br>

              <strong>Място на ателие:</strong>
              ${camper.мястоАтелие}
              <br>

              <strong>Дискусионна Група:</strong>
              ${camper.дискусионнаГрупа}
              <br>

              <strong>Място на Дискусионна Група:</strong>
              ${camper.мястоДискусионнаГрупа}
              <br>

            </div>

          `;
