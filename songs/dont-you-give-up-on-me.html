const chromatic = [
  "C", "C#", "D", "D#", "E", "F",
  "F#", "G", "G#", "A", "A#", "B"
];

let transposeAmount = 0;
let fontSize = 16;

function transposeChord(chord, amount) {

  const match = chord.match(/^([A-G](?:#|b)?)(m?)$/);

  if (!match) return chord;

  let root = match[1];
  const suffix = match[2];

  const flatMap = {
    "Db": "C#",
    "Eb": "D#",
    "Gb": "F#",
    "Ab": "G#",
    "Bb": "A#"
  };

  root = flatMap[root] || root;

  let index = chromatic.indexOf(root);

  if (index === -1) return chord;

  index = (index + amount + 12) % 12;

  return chromatic[index] + suffix;
}

function renderSong() {

  const song = document.getElementById("song");

  song.innerHTML = "";

  const lines = songContent.trim().split("\n");

  lines.forEach(line => {

    line = line.trim();

    if (line === "") {

      const empty = document.createElement("div");
      empty.className = "empty";

      song.appendChild(empty);

      return;
    }

    if (line.startsWith("[") && line.endsWith("]")) {

      const section = document.createElement("div");

      section.className = "section";

      section.textContent =
        line.substring(1, line.length - 1);

      song.appendChild(section);

      return;
    }

    const chordMatches = line.match(/\[([A-G](?:#|b)?m?)\]/g);

    if (chordMatches) {

      const chordLine = document.createElement("div");

      chordLine.className = "song-line";

      chordMatches.forEach(chord => {

        const cleanChord =
          chord.substring(1, chord.length - 1);

        const transposed =
          transposeChord(cleanChord, transposeAmount);

        const chordSpan =
          document.createElement("span");

        chordSpan.className = "chord";

        chordSpan.textContent = transposed + "   ";

        chordLine.appendChild(chordSpan);

      });

      song.appendChild(chordLine);

      const lyricLine =
        document.createElement("div");

      lyricLine.className = "song-line";

      lyricLine.textContent =
        line.replace(/\[([A-G](?:#|b)?m?)\]/g, "");

      song.appendChild(lyricLine);

    } else {

      const lyricLine =
        document.createElement("div");

      lyricLine.className = "song-line";

      lyricLine.textContent = line;

      song.appendChild(lyricLine);
    }

  });

  document.getElementById("keyDisplay").textContent =
    "Key: " + getCurrentKey();
}

function getCurrentKey() {

  return transposeChord("G", transposeAmount);
}

function transpose(amount) {

  transposeAmount += amount;

  renderSong();
}

function changeFont(amount) {

  fontSize += amount;

  if (fontSize < 12) fontSize = 12;
  if (fontSize > 30) fontSize = 30;

  document.getElementById("song").style.fontSize =
    fontSize + "px";
}

renderSong();
