const chromatic = [
  "C", "C#", "D", "D#", "E", "F",
  "F#", "G", "G#", "A", "A#", "B"
];

let transposeAmount = 0;
let fontSize = 16;

function transposeChord(chord, amount) {

  const match = chord.match(/^([A-G](?:#|b)?)(m?)$/);

  if (!match) return chord;

  let root = match[1];
  const suffix = match[2];

  const flatMap = {
    "Db": "C#",
    "Eb": "D#",
    "Gb": "F#",
    "Ab": "G#",
    "Bb": "A#"
  };

  root = flatMap[root] || root;

  let index = chromatic.indexOf(root);

  if (index === -1) return chord;

  index = (index + amount + 12) % 12;

  return chromatic[index] + suffix;
}

function transposeChordLine(line, amount) {

  return line.replace(
    /\b([A-G](?:#|b)?m?)\b/g,
    function(match) {
      return transposeChord(match, amount);
    }
  );
}

function isChordLine(line) {

  const trimmed = line.trim();

  if (!trimmed) return false;

  const parts = trimmed.split(/\s+/);

  return parts.every(part =>
    /^[A-G](?:#|b)?m?$/.test(part)
  );
}

function renderSong() {

  const song = document.getElementById("song");

  song.innerHTML = "";

  const lines = songContent
    .replace(/\r/g, "")
    .split("\n");

  let i = 0;

  while (i < lines.length) {

    const line = lines[i];

    if (line.trim() === "") {

      const empty = document.createElement("div");
      empty.className = "empty";
      song.appendChild(empty);

      i++;
      continue;
    }

    if (
      line.trim().startsWith("[") &&
      line.trim().endsWith("]")
    ) {

      const section = document.createElement("div");

      section.className = "section";

      section.textContent =
        line.trim().slice(1, -1);

      song.appendChild(section);

      i++;
      continue;
    }

    /*
      Chord line followed by lyric line.
    */

    if (
      isChordLine(line) &&
      i + 1 < lines.length &&
      lines[i + 1].trim() !== ""
    ) {

      const chordedLine =
        document.createElement("div");

      chordedLine.className = "chorded-line";

      const chords =
        document.createElement("div");

      chords.className = "chords";

      chords.textContent =
        transposeChordLine(line, transposeAmount);

      const lyrics =
        document.createElement("div");

      lyrics.className = "lyrics";

      lyrics.textContent =
        lines[i + 1].trim();

      chordedLine.appendChild(chords);
      chordedLine.appendChild(lyrics);

      song.appendChild(chordedLine);

      i += 2;
      continue;
    }

    /*
      Lyrics without a chord line.
    */

    const lyrics =
      document.createElement("div");

    lyrics.className = "lyrics";

    lyrics.style.marginBottom = "7px";

    lyrics.textContent =
      line.trim();

    song.appendChild(lyrics);

    i++;

  }

  document.getElementById("keyDisplay").textContent =
    "Key: " + transposeChord("G", transposeAmount);
}

function transpose(amount) {

  transposeAmount += amount;

  renderSong();
}

function changeFont(amount) {

  fontSize += amount;

  if (fontSize < 12) fontSize = 12;
  if (fontSize > 28) fontSize = 28;

  document.getElementById("song").style.fontSize =
    fontSize + "px";
}

renderSong();
